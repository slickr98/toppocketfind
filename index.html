<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top Pocket Find - Home</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="cart/cart.js" defer></script>
    <style>
    /* Center the hero image and overlay a badge */
    .hero-image{display:flex;justify-content:center;margin-bottom:20px}
    .hero-figure{position:relative;display:inline-block}
    .hero-img{width:min(90vw,1000px);height:auto;border-radius:10px;display:block}
    .ca-overlay{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.96);color:#0b3a5e;border:1px solid rgba(0,0,0,.08);padding:6px 12px;border-radius:9999px;font-weight:600;font-size:.95rem;box-shadow:0 2px 6px rgba(0,0,0,.08)}
    .ca-overlay small{font-weight:400;opacity:.85}
    .ca-overlay{white-space:nowrap} 
    @media (max-width:480px){
      /* On mobile, tuck the badge top-left so it doesn't cover the title */
      .ca-overlay{top:12px;left:24px;transform:none;font-size:.82rem;padding:5px 10px}
    }
      /* Contact modal */
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:1000;padding:20px}
    .modal.open{display:flex}
    .modal__card{background:#fff;width:min(440px,90vw);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.25);border:1px solid #e6e6e6}
    .modal__header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #eee}
    .modal__header h2{margin:0;font-size:1rem;letter-spacing:.03em;text-transform:uppercase;color:#1e293b}
    .modal__close{background:transparent;border:0;font-size:22px;cursor:pointer;color:#64748b}
    .modal__body{padding:14px}
    .modal .field{margin-bottom:12px}
    .modal label{display:block;font-weight:600;margin-bottom:6px;color:#334155}
    .modal input,.modal textarea{width:100%;box-sizing:border-box;display:block;padding:8px 10px;border:1px solid #d6d6d6;border-radius:8px;font-size:15px}
    .modal textarea{min-height:120px;resize:vertical}
    .modal__actions{display:flex;gap:12px;justify-content:flex-end;padding:12px 14px;border-top:1px solid #eee}
    .modal .btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
    .modal .btn-secondary{background:#e5e7eb;color:#111827}
    .modal .btn-primary{background:#0f3b63;color:#fff}
    .modal .success{display:none;color:#065f46;background:#ecfdf5;border:1px solid #a7f3d0;padding:8px 10px;border-radius:8px;margin-top:10px}
  </style>
</head>
<body class="list-page">
  <div class="main-wrapper">
    <nav>
      <a href="index.html">
        <img src="assets/pocket-logo.png" alt="Top Pocket Find Logo" />
      </a>
      <a href="games.html">Games</a>
      <a href="toys.html"></a>
      <a href="coins.html"></a>
      <a href="comics.html"></a>
      <a href="cards.html"></a>
      <a href="other.html"></a>
      <a href="cart/cart.html">Cart <span id="cart-count" class="muted"></span></a>
    </nav>

    <main>
      <!-- Featured main image -->
      <div class="hero-image">
        <figure class="hero-figure">
          <img src="assets/main-banner.png" alt="Featured Top Pocket Find" class="hero-img" />
          <figcaption class="ca-overlay">Canada only&nbsp;&nbsp;<small>— we currently ship within Canada</small></figcaption>
        </figure>
      </div>

      <!-- Your home page product listings go here -->
    </main>
  </div>

  <footer>
    <p>&copy; 2025 Top Pocket Find. All rights reserved. | Privacy | Terms | <a href="#" id="contact-open" class="footer-link">Contact</a></p>
  </footer>

  <script>
    (function(){
      const KEY='tpf_cart';

      function badge(){
        const el=document.getElementById('cart-count'); if(!el) return;
        let items=[]; try{ items=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch{}
        const count=items.reduce((n,i)=>n+i.qty,0);
        el.textContent = count ? `(${count})` : '';
      }

      function fallbackAdd(item){
        let cart=[]; try{ cart=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch{}
        const ex=cart.find(i=>i.id===item.id);
        if(ex){ ex.qty=Math.min((ex.maxQty||99), ex.qty+item.qty); }
        else { cart.push(item); }
        localStorage.setItem(KEY, JSON.stringify(cart));
        badge();
      }

      document.querySelectorAll('.add').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const item = {
            id: btn.dataset.id,
            title: btn.dataset.title,
            priceCents: Math.round(parseFloat(btn.dataset.price)*100),
            image: btn.dataset.image,
            qty: 1,
            maxQty: btn.dataset.maxqty ? parseInt(btn.dataset.maxqty,10) : 1
          };
          if (window.addToCart) window.addToCart(item); else fallbackAdd(item);
          btn.textContent='Added ✓';
          setTimeout(()=>btn.textContent='Add to Cart', 900);
        });
      });

      window.tpfBadge = badge;
      badge();
      window.addEventListener('pageshow', badge);
    })();
  </script>
  
  <!-- Contact Modal -->
  <div id="contact-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="contact-title" hidden>
    <div class="modal__card">
      <div class="modal__header">
        <h2 id="contact-title">Send an email to Top Pocket Find</h2>
        <button class="modal__close" aria-label="Close">×</button>
      </div>
      <form id="contact-form" class="modal__body">
        <div class="field">
          <label for="ct-name">Name *</label>
          <input id="ct-name" type="text" required />
        </div>
        <div class="field">
          <label for="ct-email">Email *</label>
          <input id="ct-email" type="email" required />
        </div>
        <div class="field">
          <label for="ct-phone">Phone</label>
          <input id="ct-phone" type="text" />
        </div>
        <div class="field">
          <label for="ct-msg">Message *</label>
          <textarea id="ct-msg" required></textarea>
          <div id="ct-ok" class="success">Opening your email app… If nothing opens, email <strong>leblancri@rogers.com</strong> manually.</div>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn-secondary" id="contact-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Send</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    (function(){
      const openLink=document.getElementById('contact-open');
      const modal=document.getElementById('contact-modal');
      const closeBtn=modal.querySelector('.modal__close');
      const cancelBtn=document.getElementById('contact-cancel');
      function open(){ modal.classList.add('open'); modal.removeAttribute('hidden'); document.body.style.overflow='hidden'; }
      function close(){ modal.classList.remove('open'); modal.setAttribute('hidden',''); document.body.style.overflow=''; }
      openLink && openLink.addEventListener('click', (e)=>{ e.preventDefault(); open(); });
      closeBtn.addEventListener('click', close);
      cancelBtn.addEventListener('click', close);
      modal.addEventListener('click', (e)=>{ if(e.target===modal) close(); });
      document.addEventListener('keydown', (e)=>{ if(e.key==='Escape' && modal.classList.contains('open')) close(); });

      // mailto on submit
      document.getElementById('contact-form').addEventListener('submit', (e)=>{
        e.preventDefault();
        const name=document.getElementById('ct-name').value.trim();
        const email=document.getElementById('ct-email').value.trim();
        const phone=document.getElementById('ct-phone').value.trim();
        const msg=document.getElementById('ct-msg').value.trim();
        if(!name||!email||!msg) return;
        const to='leblancri@rogers.com';
        const subject=encodeURIComponent(`TPF Contact — ${name}`);
        const body=encodeURIComponent(`Name: ${name}
Email: ${email}
Phone: ${phone || '—'}

Message:
${msg}

— Sent from toppocketfind (index modal)`);
        document.getElementById('ct-ok').style.display='block';
        window.location.href=`mailto:${to}?subject=${subject}&body=${body}`;
      });
    })();
  </script>
</body>
</html>
