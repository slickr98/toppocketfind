<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<title>Thanks! — Top Pocket Find</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body{background:#FFF8DC;margin:0;font-family:system-ui,Segoe UI,Roboto,Arial}
  .wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;max-width:560px;width:100%;
        padding:24px 22px;box-shadow:0 10px 30px rgba(0,0,0,.06);text-align:center}
  .check{width:64px;height:64px;border-radius:999px;background:#22c55e;color:#fff;
         display:grid;place-items:center;margin:4px auto 12px;font-size:40px}
  h1{margin:.2rem 0 0.5rem;color:#0a457a}
  p{margin:.35rem 0;color:#334155}
  .actions{margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{border:1px solid #00406F;background:#00406F;color:#fff;padding:10px 14px;border-radius:10px;font-weight:600;text-decoration:none}
  .btn.secondary{background:#f9fafb;color:#00406F}
</style>
<body>
  <div class="wrap">
    <div class="card">
      <div class="check">✓</div>
      <h1>Thank you!</h1>
      <p>Your order was received. A Stripe confirmation email is on the way.</p>
      <p class="muted"><strong>Note:</strong> test mode uses card <code>4242 4242 4242 4242</code>.</p>
      <div class="actions">
        <a class="btn" href="../index.html">Back to Home</a>
 
      </div>
    </div>
  </div>

  <script>
    // clear cart on success
    try { localStorage.setItem('tpf_cart','[]'); } catch {}
  </script>
</body>
</html>
